<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falron Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    </style>
</head>
<body>
    
    <div id="loader" class="loader-wrapper">
        <div class="spinner"></div>
    </div>

<!-- ШАПКА -->
    <header class="app-header">
        <div class="logo">FALRON</div>
        <button class="menu-btn" id="menuBtn">☰ Меню</button>
    </header>

        <!-- ВЫПАДАЮЩЕЕ МЕНЮ -->
    <nav class="dropdown-menu" id="dropdownMenu">
        <a href="#" onclick="filterCategory('all')">Все товары</a>
        <a href="#" onclick="filterCategory('t-shirts')">Футболки</a>
        <a href="#" onclick="filterCategory('hoodies')">Худи</a>
        <a href="#" onclick="filterCategory('jackets')">Куртки</a>
        <a href="#" onclick="filterCategory('pants')">Штаны</a> <!-- НОВАЯ КАТЕГОРИЯ -->
        <hr>
        <a href="#" onclick="showContacts(event)">📞 Контакты</a>
    </nav>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="app-container">
        <h1 id="categoryTitle">Все товары</h1>
        <div class="product-grid" id="productGrid">
            <!-- Товары будут вставляться через JS -->
        </div>
    </main>

    <!-- ФУТЕР -->
    <footer class="app-footer">
        <div class="footer-info">
            <h3>Контакты</h3>
            <p>📍 г. Москва, ул. Тверская, д. 10</p>
            <p>📞 +7 (999) 123-45-67</p>
            <p>✉️ hello@falron.ru</p>
        </div>
        
        <div class="footer-feedback">
            <h3>Ваши пожелания</h3>
            <textarea id="feedbackText" placeholder="Напишите нам, что вы думаете..."></textarea>
            <button class="buy-btn" onclick="sendFeedback()">Отправить</button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
